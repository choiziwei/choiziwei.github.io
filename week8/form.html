<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <h1>Registration Form - Middle School</h1>

    <form action="/action_page.php">
        <label for="fname"></label>
        <input type="text" id="fname" name="fname" placeholder="First Name:" required class="textbox">

        <label for="lname"></label>
        <input type="text" id="lname" name="lname" placeholder="Last Name:" required class="textbox">

        <div><label for="date">Date of Birth:</label>
            <input type="date" id="date" name="date" required class="textbox">
        </div>

        <div><label for="email"></label>
            <input type="email" id="email" name="emial" placeholder="Email:" required class="textbox">
        </div>

        <div><label for="url"></label>
            <input type="url" id="url" name="url" placeholder="Homepage URL:" class="textbox">
        </div>

        <div><label for="fav-colors">Favourite Colors:</label>
            <select name="colors" id="fav-colors" class="options">
                <option value="White">White</option>
                <option value="Black">Black</option>
                <option value="Red">Red</option>
                <option value="Yellow">Yellow</option>
                <option value="Green">Green</option>
                <option value="Blue">Blue</option>
                <option value="Purple">Purple</option>
            </select>
        </div>

        <div>
            <p><label for="self-intro">Self Introductions:</label></p>
            <textarea id="self-intro" name="self-intro"></textarea>
        </div>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>

</html>
