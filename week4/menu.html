<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
            font-family: Arial, Helvetica, sans-serif;

        }

        .home {
            display: flex;
            justify-content: space-around;
            gap: 30px;
        }

        .right {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        button {
            color: rgb(255, 255, 255);
            background-color: orangered;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
        }

        img {
            max-width: 20%;
        }

        @media screen and (max-width: 1536px) {
            .hamburger {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <img src="images/elementra2.png" width="100%">

        <div class="home">
            <div>Home</div>
            <div>Services</div>
            <div>Work</div>
            <div>Project Details</div>
            <div>Contact</div>
        </div>

        <div class="right">
            <img src="images/phone icon.png" width="50">
            <div>555-123-4567</div>
            <div><button>Contact</button></div>
            <div class="hamburger"><img src="images/hamburger.png" width="100%">
            </div>
        </div>
    </div>
</body>

</html>
