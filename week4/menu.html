<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
            font-family: Arial, Helvetica, sans-serif;

        }

        .home {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .services {
            color: #f96936;
        }

        .right {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: flex-end;
        }

        .phone-number {
            font-weight: bold;
        }

        button {
            color: rgb(255, 255, 255);
            background-color: #f96936;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            margin-right: 20px;
        }



        @media screen and (max-width: 1536px) {
            .hamburger {
                display: none;
            }
        }

        @media screen and (max-width: 1100px) {
            .hamburger {
                display: flex;
            }

            button {
                display: none;
            }

            .home {
                display: none;
            }
        }

        @media screen and (max-width: 630px) {
            button {
                display: none;
            }

            .home {
                display: none;
            }

            .phone {
                display: none;
            }

            .phone-number {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <img src="images/elementra2.png" alt="Elementra Logo" height="60px">

        <div class="home">
            <div>Home</div>
            <div class="services">Services</div>
            <div>Work</div>
            <div>Project Details</div>
            <div>Contact</div>
        </div>

        <div class="right">
            <div class="phone"><img src="images/phone icon.png" alt="Phone Icon" height="50px"></div>
            <div class="phone-number">555-123-4567</div>
            <div><button>Contact</button></div>
            <div class="hamburger"><img src="images/hamburger.png" alt="Hamburger Menu Icon" height="50px"></div>
        </div>
    </div>
</body>

</html>
