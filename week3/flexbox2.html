<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap');

        body {
            margin: 50px;
            font-family: "Space Grotesk", sans-serif;
        }

        .upper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 50px;
        }

        .positivus {
            gap: 90px;
        }

        .spreaker {
            display: flex;
            align-items: end;
            width: 40px;
        }

        .company {
            display: flex;
            justify-content: space-around;
            align-items: end;
            gap: 15px;
            filter: grayscale(100%);
        }
    </style>
</head>

<body>
    <div class="container">


        <div class="upper bar">

            <div class="positivus"><img src="images/positivus.png" alt="positivus logo"></div>

            <div>About Us</div>
            <div>Services</div>
            <div>Use Cases</div>
            <div>Pricing</div>
            <div>Blog</div>
            <div>Request a quote</div>


        </div>

        <div class="speaker">
            <img src="images/speaker.png">
        </div>

        <h1>Navigating the digital landscape for success</h1>

        <p>
            Our digital marketing agency helps businesses grow and succeed online through a range of services
            including
            SEO, PPC, social media marketing, and content creation.
        </p>
        <button>Book a consultation</button>

        <div class="company">
            <div><img src="images/amazon.png" alt="Amazon logo"></div>
            <div><img src="images/dribbble.png" alt="Dribbble logo"></div>
            <div><img src="images/hubspot.png" alt="Hubspot logo"></div>
            <div><img src="images/notion.png" alt="Notion logo"></div>
            <div><img src="images/netflix.png" alt="Netflix logo"></div>
            <div><img src="images/zoom.png" alt="Zoom logo"></div>
        </div>
    </div>
</body>

</html>
