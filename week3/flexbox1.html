<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');

        body {
            background-color: rgb(241, 238, 233);
            font-family: "Open Sans", sans-serif;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            max-width: 1024px;
            margin: 0 auto;
        }

        .project {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
        }

        .project img {
            border-radius: 5px;
        }

        h3 {
            font-size: 21px;
            font-weight: bold;
            margin: 10px;
        }

        p {
            font-size: 13px;
            color: grey;
            margin: 10px 10px 20px 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="project">
            <img src="images/custom-img-017-copyright.jpg" width="100%">

            <h3>Residental projects</h3>

            <p>
                We build sustainable and modern homes for comfortable living.
            </p>
        </div>

        <div class="project">
            <img src="images/custom-img-018-copyright.jpg" width="100%">

            <h3>Commercial spaces</h3>

            <p>
                We create efficient, inspiring workspaces for businesses of all sizes.
            </p>
        </div>

        <div class="project">
            <img src="images/custom-img-019-copyright.jpg" width="100%">

            <h3>Infrastructure works</h3>

            <p>
                We develop strong, reliable infrastructure for growing communities.
            </p>
        </div>
    </div>
</body>

</html>
